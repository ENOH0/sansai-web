<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Creative Thinking Pathway</title>
  <style>
    @font-face {
      font-family: THSarabunPSK;
      src: url('/fonts/THSarabunPSK.ttf') format('truetype');
      font-display: swap
    }

    @font-face {
      font-family: THSarabunPSK;
      src: url('/fonts/THSarabunPSK-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap
    }

    :root {
      --ink: #26364f;
      --muted: #53627a;
      --lav: #d9c9ff;
      --pink: #ffd3e6;
      --blue: #c9e8ff;
      --mint: #c9f0df;
      --peach: #ffd7bd;
      --active: #8b67c9
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: THSarabunPSK, "TH SarabunPSK", Tahoma, sans-serif
    }

    button {
      font: inherit
    }

    button:focus-visible {
      outline: 4px solid #8971cc;
      outline-offset: 5px
    }

    .model {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid #fff;
      border-radius: 34px;
      padding: 30px clamp(18px, 4vw, 54px) 32px;
      background: linear-gradient(130deg, #fff7fcf2, #f3f7fff1 48%, #f7fffaf2);
      box-shadow: 0 16px 0 #cabde15c, 0 28px 70px #41577d35
    }

    .model:before {
      content: "";
      position: absolute;
      inset: -55%;
      z-index: -3;
      background: conic-gradient(from 20deg, #ffd7e888, #d8d0ff99, #cceeff88, #d6f3df88, #ffe0c488, #ffd7e888);
      animation: aurora 18s linear infinite
    }

    .model:after {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -2;
      border-radius: 33px;
      background: linear-gradient(130deg, #fff9fcef, #f5f8fff0 48%, #f8fffbed);
      backdrop-filter: blur(18px)
    }

    .model.no-background {
      border-color: transparent;
      background: transparent;
      box-shadow: none
    }

    .model.no-background:before,
    .model.no-background:after,
    .model.no-background .orb,
    .model.no-background .sparkles {
      display: none
    }

    .model.compact-horizontal header h1 {
      font-size: clamp(31px, 3.1vw, 42px);
      line-height: 1.05;
      white-space: nowrap
    }

    .model.compact-horizontal.long-title header h1 {
      font-size: clamp(26px, 2.55vw, 35px)
    }

    .model.theme-11 .eyebrow { background: #eee0fa; color: #76548d }
    .model.theme-11 header h1 { color: #3f4e78 }
    .model.theme-11 .beam { background: linear-gradient(90deg, #d7c2ee, #b8dff5, #ffd3b8); box-shadow: 0 0 18px #ae9bd8 }
    .model.theme-11 .preview b { color: #684f87 }

    /* หัวข้อโมเดลทักษะภาษาไทย: ใช้ตัวอักษรสีขาวโดยไม่มีกรอบ/เงาสีขาว */
    .model.model-thai header h1 { color: #fff; text-shadow: none }

    .model.theme-12 .eyebrow { background: #d9f3e9; color: #39766b }
    .model.theme-12 header h1 { color: #285d59 }
    .model.theme-12 .beam { background: linear-gradient(90deg, #9fd8c0, #f2d891, #efb5cc); box-shadow: 0 0 18px #8fcab5 }
    .model.theme-12 .preview b { color: #39766b }

    .model.compact-horizontal header p { font-size: 25px }
    .model.compact-horizontal .stage { gap: 24px; margin-top: 28px }

    .model.compact-horizontal .node,
    .model.compact-horizontal .node:nth-child(3),
    .model.compact-horizontal .node:nth-child(4) {
      min-height: 150px;
      padding: 14px 16px 12px;
      transform: none;
      border-radius: 22px
    }

    .model.compact-horizontal .node:hover,
    .model.compact-horizontal .node.active {
      transform: translateY(-8px) scale(1.018)
    }

    .model.compact-horizontal .num { width: 46px; height: 46px; border-radius: 15px; font-size: 22px }
    .model.compact-horizontal .icon { font-size: 31px }
    .model.compact-horizontal .node small { margin-top: 7px; font-size: 17px; line-height: 1 }
    .model.compact-horizontal .node strong { font-size: 29px; line-height: 1 }
    .model.compact-horizontal .open { margin-top: 6px; font-size: 19px }
    .model.compact-horizontal .open b { width: 22px; height: 22px }
    .model.compact-horizontal .preview { min-height: 94px; margin-top: 15px; padding: 13px 20px }
    .model.compact-horizontal .preview b { font-size: 28px }
    .model.compact-horizontal .preview span { font-size: 24px }

    .orb {
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .6;
      animation: float 7s ease-in-out infinite
    }

    .orb.o1 {
      width: 160px;
      height: 160px;
      left: -45px;
      top: 20%;
      background: #e5caff
    }

    .orb.o2 {
      width: 190px;
      height: 190px;
      right: -65px;
      top: -30px;
      background: #c8eaff;
      animation-delay: -2s
    }

    .orb.o3 {
      width: 100px;
      height: 100px;
      right: 28%;
      bottom: -45px;
      background: #ffe0bb;
      animation-delay: -4s
    }

    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden
    }

    .sparkles i {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 14px 5px #fff;
      animation: spark 4s ease-in-out infinite
    }

    .sparkles i:nth-child(1) {
      left: 8%;
      top: 22%
    }

    .sparkles i:nth-child(2) {
      left: 28%;
      top: 10%;
      animation-delay: -1s
    }

    .sparkles i:nth-child(3) {
      right: 18%;
      top: 17%;
      animation-delay: -2.2s
    }

    .sparkles i:nth-child(4) {
      right: 7%;
      bottom: 21%;
      animation-delay: -3s
    }

    .sparkles i:nth-child(5) {
      left: 43%;
      bottom: 12%;
      animation-delay: -1.8s
    }

    header {
      text-align: center;
      position: relative;
      z-index: 2
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 18px;
      border-radius: 99px;
      background: #f2ddf8;
      color: #886a9d;
      font-size: 24px;
      font-weight: 700;
      box-shadow: inset 0 1px #fff, 0 7px 18px #9e7cb328
    }

    .eyebrow:before {
      content: "✦";
      color: #d397be;
      animation: twinkle 2s ease-in-out infinite
    }

    h1 {
      margin: 13px 0 7px;
      font-size: clamp(42px, 5vw, 64px);
      font-weight: 700;
      line-height: 1.04;
      color: #293a59;
      text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 8px 22px #fff
    }

    header p {
      display: inline-block;
      margin: 8px auto 0;
      padding: 4px 16px;
      border-radius: 999px;
      color: #354762;
      background: #ffffffd9;
      box-shadow: 0 5px 18px #32405e18;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25
    }

    .stage {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(28px, 5vw, 76px);
      margin: 42px auto 24px;
      perspective: 1200px;
      max-width: 1320px
    }

    .beam {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 49%;
      height: 6px;
      z-index: -1;
      border-radius: 99px;
      background: linear-gradient(90deg, #dbc4f0, #acddef, #acddef, #ffc7aa);
      box-shadow: 0 0 18px #bda8e9;
      overflow: hidden
    }

    .beam:after {
      content: "";
      position: absolute;
      top: -5px;
      width: 76px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      filter: blur(5px);
      box-shadow: 0 0 24px #fff;
      animation: travel 4.8s ease-in-out infinite
    }

    .node {
      --tone: #dbc8fb;
      --deep: #b392db;
      position: relative;
      min-height: 190px;
      border: 2px solid #fff;
      border-radius: 28px;
      padding: 24px 18px 24px;
      text-align: left;
      color: #34445e;
      background: linear-gradient(145deg, #fff 0%, var(--tone) 72%);
      box-shadow: 0 14px 0 var(--deep), 0 25px 38px #303d593f, inset 0 2px #fff;
      transform-style: preserve-3d;
      transform: rotateX(7deg) rotateY(-3deg) translateY(0);
      transition: transform .55s cubic-bezier(.2, .8, .2, 1), box-shadow .55s, filter .55s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden
    }

    .node:nth-child(3) {
      --tone: #cde8fb;
      --deep: #91bfdc;
      transform: rotateX(7deg)
    }

    .node:nth-child(4) {
      --tone: #ffd7bd;
      --deep: #e9a97e;
      transform: rotateX(7deg) rotateY(3deg)
    }

    .node:before {
      content: "";
      position: absolute;
      inset: -70% -20%;
      background: linear-gradient(105deg, transparent 39%, #ffffffcf 49%, transparent 59%);
      transform: translateX(-70%) rotate(8deg);
      animation: shine 5.5s ease-in-out infinite
    }

    .node:nth-child(3):before {
      animation-delay: -1.7s
    }

    .node:nth-child(4):before {
      animation-delay: -3.4s
    }

    .node:hover,
    .node.active {
      transform: rotateX(0) rotateY(0) translateY(-16px) scale(1.035);
      filter: saturate(1.08);
      box-shadow: 0 17px 0 var(--deep), 0 34px 52px #53628046, 0 0 35px var(--tone), inset 0 2px #fff
    }

    .node.active {
      animation: pulse 2.4s ease-in-out infinite
    }

    .node-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative
    }

    .num {
      display: grid;
      place-items: center;
      width: 61px;
      height: 61px;
      border-radius: 21px;
      background: #ffffffd9;
      font: 700 28px Georgia;
      color: #6e7891;
      box-shadow: 0 9px 18px #75819825, inset 0 2px #fff
    }

    .icon {
      font-size: 42px;
      filter: drop-shadow(0 6px 5px #6e71972d)
    }

    .node small {
      display: block;
      margin-top: 20px;
      color: #4b5b73;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .7px
    }

    .node strong {
      display: block;
      font-size: 37px;
      font-weight: 700;
      line-height: 1.06;
      color: #263750;
      text-shadow: 0 1px #fff
    }

    .open {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      color: #59477f;
      font-size: 24px;
      font-weight: 700
    }

    .open b {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff
    }

    .preview {
      max-width: 950px;
      margin: 20px auto 0;
      min-height: 112px;
      padding: 18px 24px;
      border: 2px solid #fff;
      border-radius: 23px;
      background: #fffffff2;
      box-shadow: 0 9px 25px #3949662b;
      text-align: center;
      transition: opacity .3s, transform .3s
    }

    .preview.swap {
      opacity: .25;
      transform: translateY(6px)
    }

    .preview b {
      display: block;
      color: #654878;
      font-size: 32px;
      font-weight: 700
    }

    .preview span {
      display: block;
      color: #33465f;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.3
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 17px
    }

    .dots button {
      width: 11px;
      height: 11px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #c9c8d6;
      transition: .3s
    }

    .dots button.on {
      width: 34px;
      border-radius: 99px;
      background: var(--active);
      box-shadow: 0 0 14px var(--active)
    }

    dialog {
      width: min(970px, calc(100% - 28px));
      max-height: 88vh;
      max-height: 88dvh;
      padding: 0;
      border: 1px solid #fff;
      border-radius: 30px;
      color: var(--ink);
      background: linear-gradient(145deg, #fff, #fbf8ff 52%, #f1f9ff);
      box-shadow: 0 36px 100px #2a355a76;
      overflow: auto
    }

    dialog::backdrop {
      background: #313b5a72;
      backdrop-filter: blur(9px)
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: flex-start;
      gap: 17px;
      padding: 24px 27px 19px;
      border-bottom: 1px solid #e7e5ef;
      background: #fffdf8e8;
      backdrop-filter: blur(18px)
    }

    .modal-badge {
      display: grid;
      place-items: center;
      flex: 0 0 68px;
      height: 68px;
      border-radius: 23px;
      background: var(--tone, #e4d7fa);
      font: 700 27px Georgia;
      box-shadow: 0 9px 0 var(--deep, #bca4dd)
    }

    .modal-title {
      flex: 1
    }

    .modal-title small {
      font-size: 19px;
      color: #9b8aaa
    }

    .modal-title h2 {
      margin: 2px 0 0;
      font-size: 39px;
      line-height: 1;
      color: #5a6179
    }

    .close {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 17px;
      background: #f3edf6;
      color: #7e6c8c;
      font-size: 35px;
      line-height: 1;
      cursor: pointer
    }

    .modal-body {
      padding: 25px 28px 31px
    }

    .lead {
      margin: 0;
      color: #64748a;
      font-size: 27px;
      line-height: 1.45
    }

    .sub-label {
      margin: 23px 0 12px;
      color: #977da1;
      font-size: 22px;
      font-weight: 700
    }

    .submodel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 13px
    }

    .submodel button {
      min-height: 104px;
      padding: 15px;
      border: 1px solid #fff;
      border-radius: 18px;
      text-align: left;
      color: #53647b;
      background: linear-gradient(145deg, #fff, #f0e8fa);
      box-shadow: 0 6px 0 #d8cde5;
      cursor: pointer;
      transition: .25s
    }

    .submodel button:nth-child(2n) {
      background: linear-gradient(145deg, #fff, #e7f4fc);
      box-shadow: 0 6px 0 #c9deec
    }

    .submodel button:nth-child(3n) {
      background: linear-gradient(145deg, #fff, #fff0df);
      box-shadow: 0 6px 0 #ead3bd
    }

    .submodel button:hover,
    .submodel button.on {
      transform: translateY(-5px);
      box-shadow: 0 10px 0 #c9b5df, 0 18px 25px #7e789c2a
    }

    .submodel b {
      display: block;
      font-size: 27px;
      line-height: 1.08
    }

    .submodel span {
      display: block;
      margin-top: 4px;
      color: #8893a6;
      font-size: 20px
    }

    .nested-detail {
      margin-top: 18px;
      padding: 18px 20px;
      border-radius: 19px;
      background: #fff;
      border: 1px solid #e7e4ee;
      box-shadow: 0 8px 22px #70809a18;
      color: #5e6d82;
      font-size: 25px;
      line-height: 1.38
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px
    }

    .kpi {
      padding: 17px;
      border-radius: 20px;
      text-align: center;
      background: linear-gradient(145deg, #fff, #f4e8fb);
      box-shadow: 0 6px 0 #dac8e8
    }

    .kpi b {
      display: block;
      color: #8a6ca2;
      font: 700 42px Georgia
    }

    .kpi span {
      font-size: 21px;
      color: #718095
    }

    @media(max-width:900px) {
      .model.compact-horizontal header h1 { white-space: normal; font-size: clamp(30px, 5vw, 38px) }
      .model.compact-horizontal.long-title header h1 { font-size: clamp(28px, 4.6vw, 35px) }
    }

    @media(max-width:760px) {
      .model {
        padding: 25px 15px 28px;
        border-radius: 25px
      }

      .stage {
        grid-template-columns: 1fr;
        gap: 28px;
        margin-top: 30px
      }

      .beam {
        left: 50%;
        right: auto;
        top: 6%;
        bottom: 8%;
        width: 5px;
        height: auto
      }

      .beam:after {
        width: 15px;
        height: 65px;
        animation: travelY 4.8s ease-in-out infinite
      }

      .node,
      .node:nth-child(3),
      .node:nth-child(4) {
        min-height: 150px;
        transform: rotateX(4deg);
        padding: 18px
      }

      .node:hover,
      .node.active {
        transform: translateY(-8px) scale(1.015)
      }

      .node strong {
        font-size: 31px
      }

      .node small {
        margin-top: 10px
      }

      .preview {
        min-height: 0
      }

      .modal-head {
        padding: 20px 17px
      }

      .modal-body {
        padding: 20px 17px
      }

      .modal-badge {
        flex-basis: 56px;
        height: 56px
      }

      .modal-title h2 {
        font-size: 32px
      }

      .kpis {
        grid-template-columns: 1fr
      }

      .model.compact-horizontal .node,
      .model.compact-horizontal .node:nth-child(3),
      .model.compact-horizontal .node:nth-child(4) { min-height: 142px }

      .model.compact-horizontal .node strong { font-size: 28px }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        animation: none !important;
        transition: none !important
      }
    }

    @keyframes aurora {
      to {
        transform: rotate(1turn)
      }
    }

    @keyframes float {
      50% {
        transform: translateY(-20px) scale(1.08)
      }
    }

    @keyframes spark {
      50% {
        opacity: .25;
        transform: scale(.5)
      }
    }

    @keyframes twinkle {
      50% {
        transform: rotate(35deg) scale(1.3)
      }
    }

    @keyframes shine {

      0%,
      52% {
        transform: translateX(-75%) rotate(8deg)
      }

      75%,
      100% {
        transform: translateX(75%) rotate(8deg)
      }
    }

    @keyframes pulse {
      50% {
        filter: saturate(1.12) brightness(1.04)
      }
    }

    @keyframes travel {
      0% {
        left: -5%
      }

      33% {
        left: 44%
      }

      66%,
      100% {
        left: 94%
      }
    }

    @keyframes travelY {
      0% {
        top: -3%
      }

      33% {
        top: 43%
      }

      66%,
      100% {
        top: 92%
      }
    }
  </style>
</head>

<body>
  <main class="model">
    <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
    <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <header>
      <span class="eyebrow" id="model-eyebrow">CREATIVE THINKING PATHWAY</span>
      <h1 id="model-title">โจทย์ท้าทาย · คิดและสร้างคำตอบ · ผลงานใช้ได้จริง</h1>
      <p id="model-description">โมเดลพัฒนาการคิด วิเคราะห์ แก้ปัญหา และประยุกต์ใช้ — แตะแต่ละขั้นเพื่อดูรายละเอียด</p>
    </header>
    <section class="stage" aria-label="โมเดลกระบวนการพัฒนาทักษะการคิด">
      <div class="beam" aria-hidden="true"></div>
      <button class="node active" data-step="challenge" style="--tone:#e4cdf7;--deep:#bd9cdb">
        <span class="node-top"><span class="num">01</span><span class="icon">◇</span></span><small>DISCOVER THE
          CHALLENGE</small><strong>โจทย์ท้าทาย</strong><span class="open">เปิดรายละเอียด <b>↗</b></span>
      </button>
      <button class="node" data-step="create" style="--tone:#cde9fb;--deep:#91bfdc">
        <span class="node-top"><span class="num">02</span><span class="icon">✦</span></span><small>THINK · DESIGN ·
          CREATE</small><strong>คิดและสร้างคำตอบ</strong><span class="open">เปิดรายละเอียด <b>↗</b></span>
      </button>
      <button class="node" data-step="apply" style="--tone:#ffd8bd;--deep:#e9aa7d">
        <span class="node-top"><span class="num">03</span><span class="icon">◎</span></span><small>REAL-WORLD
          IMPACT</small><strong>ผลงานใช้ได้จริง</strong><span class="open">เปิดรายละเอียด <b>↗</b></span>
      </button>
    </section>
    <div class="preview" aria-live="polite"><b id="preview-title"></b><span id="preview-text"></span></div>
    <div class="dots" aria-label="เลือกขั้นตอน"><button class="on" data-go="0"

      : [['#e4d3f7', '#b99bd9'], ['#d2eafb', '#93bedb'], ['#ffddc5', '#e5aa80']];
    nodes.forEach((node, i) => { const d = data[i], c = colors[i]; d.tone = c[0]; d.deep = c[1]; node.dataset.step = d.key; node.style.cssText = `--tone:${d.tone};--deep:${d.deep}`; node.querySelector('.num').textContent = d.no; node.querySelector('.icon').textContent = icons[i]; node.querySelector('small').textContent = d.kicker; node.querySelector('strong').textContent = d.title });
    let current = 0, timer, focusBefore;
    function activate(i) { current = (i + data.length) % data.length; nodes.forEach((n, j) => n.classList.toggle('active', j === current)); dots.forEach((n, j) => n.classList.toggle('on', j === current)); document.documentElement.style.setProperty('--active', data[current].deep); document.querySelector('.preview').classList.add('swap'); setTimeout(() => { previewTitle.textContent = data[current].title; previewText.textContent = data[current].preview; document.querySelector('.preview').classList.remove('swap') }, 160) }
    function restart() { clearInterval(timer); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(() => activate(current + 1), 4800) }
    function detailsHTML(d) { const buttons = d.items.map((x, i) => `<button data-sub="${i}" class="${i === 0 ? 'on' : ''}"><b>${x[0]}</b><span>แตะเพื่ออ่านรายละเอียด</span></button>`).join(''); const kpis = d.kpis ? `<div class="sub-label">ผลลัพธ์เชิงประจักษ์</div><div class="kpis">${d.kpis.map(k => `<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>` : ''; return `<div class="sub-label">โมเดลย่อยของขั้นตอน</div><div class="submodel">${buttons}</div><div class="nested-detail" id="nested-detail">${d.items[0][1]}</div>${kpis}` }
    function openDetail(i) { activate(i); clearInterval(timer); const d = data[i]; focusBefore = document.activeElement; document.getElementById('modal-badge').textContent = d.no; document.getElementById('modal-badge').style.cssText = `--tone:${d.tone};--deep:${d.deep}`; document.getElementById('modal-kicker').textContent = d.kicker; document.getElementById('modal-heading').textContent = d.title; document.getElementById('modal-lead').textContent = d.lead; document.getElementById('modal-extra').innerHTML = detailsHTML(d); dialog.showModal(); dialog.scrollTop = 0; document.querySelector('.close').focus(); reportHeight() }
    nodes.forEach((n, i) => n.addEventListener('click', () => openDetail(i))); dots.forEach((n, i) => n.addEventListener('click', () => { activate(i); restart() }));
    document.addEventListener('click', e => { const b = e.target.closest('[data-sub]'); if (!b) return; const i = Number(b.dataset.sub); document.querySelectorAll('[data-sub]').forEach(x => x.classList.toggle('on', x === b)); document.getElementById('nested-detail').textContent = data[current].items[i][1] });
    document.querySelector('.close').addEventListener('click', () => dialog.close()); dialog.addEventListener('click', e => { if (e.target === dialog) { const r = dialog.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close() } }); dialog.addEventListener('close', () => { restart(); if (focusBefore?.isConnected) focusBefore.focus() });
    function reportHeight() { requestAnimationFrame(() => { const h = Math.ceil(document.querySelector('.model').getBoundingClientRect().height + 8); parent.postMessage({ type: 'd1-thinking-model-height', height: h }, location.origin) }) }
    new ResizeObserver(reportHeight).observe(document.querySelector('.model')); addEventListener('load', reportHeight); addEventListener('resize', reportHeight); activate(0); restart(); setTimeout(reportHeight, 400);
  </script>
</body>
