<script>

{title:'ตรวจสอบและย้อนกลับ',tag:'ก่อน • ระหว่าง • หลังเรียน',tone:'#25aaa2',copy:'ครูพัฒนาเครื่องมือตรวจสอบความรู้ก่อนเรียน ระหว่างเรียน และหลังเรียนให้เหมาะสมกับผู้เรียนแต่ละแผนการเรียน พร้อมใช้เทคโนโลยีช่วยประเมินและให้ข้อมูลย้อนกลับ',points:[['ก่อนเรียน','ตรวจสอบความรู้พื้นฐานและความพร้อม เพื่อนำข้อมูลไปวางแผนกิจกรรมและความช่วยเหลือ'],['ระหว่างเรียน','ติดตามจากพฤติกรรม การมีส่วนร่วม การตอบคำถาม แบบฝึกหัด การส่งงาน และการทดสอบย่อย'],['หลังเรียนและข้อมูลย้อนกลับ','สรุปผล ชี้สิ่งที่ทำได้ดีและสิ่งที่ควรพัฒนา เพื่อให้ผู้เรียนปรับปรุงได้ทันที']],apps:['Quizizz','Kahoot','Google Forms','Liveworksheets','Socrative','Padlet','Nearpod','Facebook','Line','Google Classroom']},
{title:'นำผลไปพัฒนา',tag:'ปรับการสอน • นิเทศ • PLC',tone:'#efa641',copy:'ครูบันทึกข้อมูลจากการประเมิน ปัญหา และแนวทางแก้ไขไว้หลังแผน แล้วใช้ข้อมูลร่วมกันเพื่อปรับการสอนและพัฒนาผู้เรียนอย่างเป็นระบบ',points:[['บันทึกและนิเทศ','ครูคู่นิเทศ หัวหน้ากลุ่มสาระ และฝ่ายบริหารร่วมออกแบบ นิเทศ ติดตาม และให้ข้อเสนอแนะอย่างต่อเนื่อง'],['PLC และพัฒนาตามระดับ','เข้าร่วม PLC สัปดาห์ละ 1 คาบ จัดสอนซ่อมเสริม เพิ่มแบบฝึก และส่งเสริมผู้เรียนที่พร้อมให้ช่วยเพื่อนหรือเข้าร่วมการแข่งขัน'],['วิจัยในชั้นเรียน','ทำวิจัยปีการศึกษาละ 1 เรื่อง เพื่อแก้ปัญหา พัฒนา ส่งเสริม หรือต่อยอดความรู้ ทักษะ สมรรถนะ เจตคติ และคุณลักษณะ']]},

const nodes=document.getElementById('nodes'),detail=document.getElementById('detail'),stage=document.querySelector('.stage'),toggle=document.getElementById('toggle'),statusEl=document.getElementById('status'),info=document.getElementById('info'),tool=document.getElementById('tool');let active=0,playing=true,timer;
data.forEach((d,i)=>{const b=document.createElement('button');b.className='node';b.innerHTML=`<b>${i+1}</b><span>${d.title}</span>`;b.onclick=()=>{select(i);openInfo();stop()};nodes.append(b)});
function select(i){active=i;const d=data[i];document.querySelectorAll('.node').forEach((n,x)=>n.classList.toggle('active',x===i));detail.style.setProperty('--tone',d.tone);detail.innerHTML=`<div class="detail-head"><span class="num">${i+1}</span><div><small>ขั้นตอนที่ ${i+1} จาก 5</small><h2>${d.title}</h2><small>${d.tag}</small></div></div><p class="copy">${d.copy}</p><h3>โมเดลย่อย — คลิกเพื่อขยาย</h3><ul class="points">${d.points.map((p,x)=>`<li><button data-point="${x}" aria-expanded="false">${p[0]}</button><div class="answer">${p[1]}</div></li>`).join('')}</ul>${d.apps?`<h3>คลิกเครื่องมือเพื่อดูภาพ</h3><div class="apps">${d.apps.map((a,x)=>`<button data-app="${x}">${a}</button>`).join('')}</div>`:''}<button class="open">อ่านรายละเอียดทั้งหมด</button>`;detail.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>{const li=b.parentElement;li.classList.toggle('open');b.setAttribute('aria-expanded',li.classList.contains('open'))});detail.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openTool(d.apps[+b.dataset.app],d.tone));detail.querySelector('.open').onclick=openInfo}
function openInfo(){const d=data[active];document.getElementById('infoTitle').textContent=`${active+1}. ${d.title} — ${d.tag}`;document.getElementById('infoCopy').textContent=d.copy;document.getElementById('infoList').innerHTML=d.points.map(p=>`<li><strong>${p[0]}</strong><br>${p[1]}</li>`).join('');info.showModal()}
function openTool(name,tone){const initials=name.split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase(),svg=`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><defs><linearGradient id="g"><stop stop-color="${tone}"/><stop offset="1" stop-color="#ef73a1"/></linearGradient></defs><rect width="500" height="500" rx="100" fill="url(#g)"/><circle cx="130" cy="120" r="80" fill="white" opacity=".2"/><text x="250" y="285" text-anchor="middle" font-family="Arial" font-size="120" font-weight="bold" fill="white">${initials}</text><text x="250" y="365" text-anchor="middle" font-family="Arial" font-size="28" fill="white">${name}</text></svg>`;document.getElementById('toolTitle').textContent=name;document.getElementById('toolArt').src=`data:image/svg+xml,${encodeURIComponent(svg)}`;tool.showModal()}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{select((active+1)%5);schedule()},6000)}function start(){playing=true;stage.classList.remove('paused');toggle.textContent='หยุด';statusEl.textContent='กำลังเล่นอัตโนมัติ';schedule()}function stop(){playing=false;clearTimeout(timer);stage.classList.add('paused');toggle.textContent='เล่นต่อ';statusEl.textContent='หยุดเพื่ออ่าน'}toggle.onclick=()=>playing?stop():start();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).close());[info,tool].forEach(d=>d.onclick=e=>{const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()});document.addEventListener('keydown',e=>{if('12345'.includes(e.key)&&!info.open&&!tool.open){select(+e.key-1);openInfo();stop()}});select(0);start();

function reportHeight(){requestAnimationFrame(()=>{const page=document.querySelector('.page');const height=Math.ceil(page?page.getBoundingClientRect().height+8:document.body.scrollHeight);if(window.parent!==window)window.parent.postMessage({type:'d4-assessment-cycle-height',height},window.location.origin)})}
new ResizeObserver(reportHeight).observe(document.body);window.addEventListener('load',reportHeight);setTimeout(reportHeight,600);
[info,tool].forEach(d=>d.addEventListener('close',reportHeight));
</script></body></html>
