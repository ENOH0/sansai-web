function building(b){
  const w=b.w*U,d=b.d*UY,h=b.h*U;
  const g=el('b',`left:${b.x*U}px;top:${b.y*UY}px;width:${w}px;height:${d}px;--w:${b.wc};--r:${b.rc}`,b._into||scene);
  if(b._into)g.style.cssText+=';position:absolute';
  g.dataset.n=b.n;
  if(b.s==='plaza'){el('flat pave',`left:0;top:0;width:${w}px;height:${d}px;border-radius:10px`,g);return g}
  if(b.lift){const L=b.lift*U;
    [[0,0],[w-3,0],[0,d-3],[w-3,d-3],[w/2-1.5,0],[w/2-1.5,d-3]].forEach(([px,py])=>{
      const p=el('b',`left:${px}px;top:${py}px;width:3px;height:3px`,g);
      face(p,'wall shade2',`left:0;top:0;width:3px;height:${L}px;transform-origin:0 0;transform:rotateX(90deg)`);
      face(p,'wall shade2',`left:0;top:0;width:${L}px;height:3px;transform-origin:0 0;transform:rotateY(-90deg)`);});
    const up=el('b',`left:0;top:0;width:${w}px;height:${d}px;transform:translateZ(${L}px);pointer-events:auto`,g);
    return building({...b,lift:0,x:0,y:0,_into:up});}
  const wc=b.s==='glass'?'glass':'wall'+(b.win?' win':'');
  const r=b.lift===0&&b._into?d*.75:b.s==='gable'?Math.min(d*.45,40):b.s==='vault'?d*.5:0;
  // ผนัง 4 ด้าน (ด้านข้าง x ต่อยอดเป็นหน้าจั่ว)
  const nW=face(g,wc+' shade1',`left:0;top:0;width:${w}px;height:${h}px;transform-origin:0 0;transform:rotateX(90deg)`);
  const sW=face(g,wc+' shade1',`left:0;top:${d}px;width:${w}px;height:${h}px;transform-origin:0 0;transform:rotateX(90deg)`);

  const side=(left)=>{
    const s=face(g,wc+' shade2',`left:${left}px;top:0;width:${h+r}px;height:${d}px;transform-origin:0 0;transform:rotateY(-90deg)`);
    if(b.doors)el('shutter side','',s);   // ประตูม้วน ผนังด้านยาว (หน้า-หลัง)
    if(b.s==='gable')s.style.clipPath=`polygon(0 0,${h}px 0,${h+r}px 50%,${h}px 100%,0 100%)`;
    if(b.s==='vault')s.style.clipPath=`polygon(0 0,${h}px 0,${h+r*.7}px 15%,${h+r}px 50%,${h+r*.7}px 85%,${h}px 100%,0 100%)`;
  };
  side(0);side(w);
  if(b.s==='gable'){
    const L=Math.hypot(d/2,r),a=Math.atan2(r,d/2)*180/Math.PI;
    face(g,'roof',`left:0;top:0;width:${w}px;height:${L}px;transform-origin:0 0;transform:translateZ(${h}px) rotateX(${a}deg)`);
    face(g,'roof shade1',`left:0;top:${d}px;width:${w}px;height:${L}px;transform-origin:0 0;transform:translateZ(${h}px) rotateX(${180-a}deg)`);
  }else if(b.s==='vault'){
    const n=6,R=d/2;
    for(let i=0;i<n;i++){const a0=Math.PI*i/n,a1=Math.PI*(i+1)/n;
      const y0=R-R*Math.cos(a0),z0=R*Math.sin(a0)*.7,y1=R-R*Math.cos(a1),z1=R*Math.sin(a1)*.7;
      const L=Math.hypot(y1-y0,z1-z0)+1,ang=Math.atan2(z1-z0,y1-y0)*180/Math.PI;
      face(g,'roof'+(i%2?' shade1':''),`left:0;top:${y0}px;width:${w}px;height:${L}px;transform-origin:0 0;transform:translateZ(${h+z0}px) rotateX(${ang}deg)`);}
  }else{
    face(g,b.s==='glass'?'glass':'roof',`left:0;top:0;width:${w}px;height:${d}px;transform:translateZ(${h}px)`);
  }
  if(b.n)g.addEventListener('click',e=>{if(!moved)select(b.n)});
  return g;
}

B.filter(b=>b.n).forEach(b=>{const bb=billboard(b.x+b.w/2,b.y+b.d/2,(b.lift||0)*U+b.h*U+(b.s==='gable'?Math.min(b.d*UY*.45,40):b.s==='vault'?b.d*UY*.35:0)+(b.s==='plaza'?46:22),`<div class="pin"><span><em>${b.n}</em></span></div>`);
  bb.firstChild.addEventListener('click',()=>{if(!moved)select(b.n)});pins[b.n]=bb.firstChild});

// รายการอาคาร
const legend=document.getElementById('legend');
[...B].filter(b=>b.n).sort((a,b)=>a.n-b.n).forEach(b=>{const bt=document.createElement('button');bt.type='button';bt.dataset.n=b.n;bt.innerHTML=`<b>${b.n}</b>${b.t}`;bt.onclick=()=>select(b.n,true);legend.appendChild(bt)});

let cur=null;
let fly=null;   // บินกล้องไปยังอาคารอย่างนุ่มนวล
let saved=null;   // มุมกล้องก่อนเปิดแผงข้อมูล (ใช้ซูมกลับเมื่อปิด)
function flyTo(x,y,z,px=null,py=0){fly={x0:camX,y0:camY,z0:zoom,p0:panX,q0:panY,x,y,z,px,py,t:0};auto=false}
function stepFly(){if(!fly)return;fly.t=Math.min(1,fly.t+(reduce?1:.045));const k=1-Math.pow(1-fly.t,3);
  camX=fly.x0+(fly.x-fly.x0)*k;camY=fly.y0+(fly.y-fly.y0)*k;zoom=fly.z0+(fly.z-fly.z0)*k;const tx=fly.px!==null?fly.px:(innerWidth>700?-200:0);panX=fly.p0+(tx-fly.p0)*k;panY=fly.q0+(fly.py-fly.q0)*k;
  render();if(fly.t>=1)fly=null}
function select(n,focus){
  cur=cur===n&&!focus?null:n;
  Object.entries(G).forEach(([k,g])=>g.classList.toggle('on',+k===cur));
  if(n==null){cur=null}
  Object.entries(pins).forEach(([k,p])=>p.classList.toggle('on',+k===cur));
  legend.querySelectorAll('button[data-n]').forEach(b=>b.classList.toggle('on',+b.dataset.n===cur));
  const panel=document.getElementById('panel');
  if(cur==null){panel.classList.remove('show');if(saved){flyTo(saved.camX,saved.camY,saved.zoom,saved.panX,saved.panY);saved=null}return}
  const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const b=cur==='field'?{n:'⚽',t:'สนามฟุตบอล',x:60,y:45,w:380,d:205}:B.find(x=>x.n===cur);
  document.getElementById('pNo').textContent=b.n;document.getElementById('pName').textContent=b.t;
  document.getElementById('pSub').textContent=[b.fl?b.fl+' ชั้น':'',b.desc||''].filter(Boolean).join(' · ');
  const L=ACT[String(cur)]||[];
  document.getElementById('pList').innerHTML=L.length?L.map(i=>`<div class="pitem"><span class="rm">${esc(i.r)}</span><p class="ac">${esc(i.a||'—')}</p>${i.p?`<p class="pl">👥 ${esc(i.p)}</p>`:''}${i.t?`<p class="tc">👤 ${esc(i.t)}</p>`:''}</div>`).join(''):'<div class="pempty">ไม่มีกิจกรรมในอาคารนี้</div>';
  if(!panel.classList.contains('show'))saved={camX,camY,zoom,panX,panY};
  panel.classList.add('show');document.getElementById('pList').scrollTop=0;
  flyTo((b.x+b.w/2)*U-990,(b.y+b.d/2)*UY-173.5,Math.max(zoom,2.4));
  return;
  if(focus){const c=legend.querySelector(`[data-n="${cur}"]`);c&&c.scrollIntoView({block:'nearest'})}
  auto=false;
}

// กล้อง: หมุน (rot) เอียง (tilt) ซูม (zoom)
let camX=0,camY=0,panX=0,panY=0,t0=0,rot=0,tilt=55,zoom=1,auto=true,moved=false;
const fit=()=>Math.min(innerWidth/1500,innerHeight/430);   // ขยายให้เต็มจอ (ด้านข้างล้นได้ ใช้ 2 นิ้วเลื่อนดู)
function render(){
  scene.style.transform=`translate(${panX}px,${panY}px) scale(${zoom*fit()}) rotateX(${tilt}deg) rotateZ(${rot}deg) translate(${-camX}px,${-camY}px)`;
  bills.forEach(bb=>bb.style.transform=`translateZ(${bb.dataset.z}px) rotateZ(${-rot}deg) rotateX(${-tilt}deg)`);
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
requestAnimationFrame(function loop(){stepCam();stepFly();if(!reduce)stepMov();if(auto&&!reduce){t0+=.004;rot=Math.sin(t0)*18;render()}requestAnimationFrame(loop)});

const view=document.getElementById('view'),pts=new Map();let last=null,pinch0=0,zoom0=1,downAt=null,mid0=null,pan0=null;
const ZMIN=.4,ZMAX=10;
/* ===== Free cam: ย้ายจุดที่กล้องมอง (camX, camY) ไปได้ทั่วผัง หมุน/เอียงรอบจุดนั้น ===== */
function toWorld(dx,dy){const s=zoom*fit(),r=rot*Math.PI/180,t=Math.cos(tilt*Math.PI/180)||.2;
  const wx=dx/s,wy=dy/(s*t);return [wx*Math.cos(r)+wy*Math.sin(r),-wx*Math.sin(r)+wy*Math.cos(r)]}
function camMove(dx,dy){const [x,y]=toWorld(dx,dy);camX=Math.max(-1100,Math.min(1100,camX+x));camY=Math.max(-300,Math.min(300,camY+y));auto=false;render()}
const hold={x:0,y:0,r:0,t:0},keys=new Set();
function stepCam(){let x=hold.x,y=hold.y,r=hold.r,t=hold.t;
  if(keys.has('w')||keys.has('arrowup'))y-=1;if(keys.has('s')||keys.has('arrowdown'))y+=1;
  if(keys.has('a')||keys.has('arrowleft'))x-=1;if(keys.has('d')||keys.has('arrowright'))x+=1;
  if(keys.has('q'))r-=1;if(keys.has('e'))r+=1;if(keys.has('r'))t-=1;if(keys.has('f'))t+=1;
  if(keys.has('+')||keys.has('='))zoom=Math.min(ZMAX,zoom*1.02);if(keys.has('-'))zoom=Math.max(ZMIN,zoom/1.02);
  if(x||y)camMove(x*8,y*8);if(r||t){rot+=r*1.2;tilt=Math.max(10,Math.min(85,tilt+t*.8));auto=false;render()}
  else if(keys.size)render()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if('wasdqerf+-='.includes(k)||k.startsWith('arrow')){keys.add(k);e.preventDefault()}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-mv]').forEach(b=>{const [k,v]=b.dataset.mv.split(':');
  const on=e=>{e.preventDefault();hold[k]=+v},off=()=>{hold[k]=0};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
// ซูมโดยให้จุดใต้นิ้ว/เมาส์อยู่ที่เดิม
function zoomAt(z,cx,cy){z=Math.max(ZMIN,Math.min(ZMAX,z));const r=view.getBoundingClientRect(),ox=r.left+r.width/2+panX,oy=r.top+r.height/2+panY,k=z/zoom;panX+=(cx-ox)*(1-k);panY+=(cy-oy)*(1-k);zoom=z;render()}
view.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;downAt={x:e.clientX,y:e.clientY};
  if(pts.size===2){const [a,b]=[...pts.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoom;mid0={x:(a.x+b.x)/2,y:(a.y+b.y)/2};pan0={x:panX,y:panY};auto=false}last={x:e.clientX,y:e.clientY}});
view.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(downAt&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>6){moved=true;auto=false}
  if(pts.size===2){const [a,b]=[...pts.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    camMove(-(m.x-mid0.x),-(m.y-mid0.y));mid0=m;   // สองนิ้วลาก = เลื่อนกล้องไปทั่วผัง
    zoomAt(zoom0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0,m.x,m.y);return}
  if(e.shiftKey||e.buttons===2||e.buttons===4){camMove(-(e.clientX-last.x),-(e.clientY-last.y));last={x:e.clientX,y:e.clientY};return}
  if(!moved)return;
  rot-= (e.clientX-last.x)*.3;tilt=Math.max(10,Math.min(85,tilt-(e.clientY-last.y)*.2));last={x:e.clientX,y:e.clientY};render()});
const up=e=>{pts.delete(e.pointerId);if(pts.size===1){last=[...pts.values()][0]}setTimeout(()=>{if(!pts.size)moved=false},0)};
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{e.preventDefault();auto=false;zoomAt(zoom*(e.deltaY<0?1.12:.89),e.clientX,e.clientY)},{passive:false});
view.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('zin').onclick=()=>{zoom=Math.min(ZMAX,zoom*1.3);render()};
document.getElementById('zout').onclick=()=>{zoom=Math.max(ZMIN,zoom/1.3);render()};
document.getElementById('reset').onclick=()=>{saved=null;rot=0;tilt=55;zoom=1;panX=0;panY=0;camX=0;camY=0;auto=true;select(null);cur=null;render()};
const setLegend=on=>{document.body.classList.toggle('has-legend',on);render()};
document.getElementById('lclose').onclick=()=>setLegend(false);document.getElementById('lopen').onclick=()=>setLegend(true);
setLegend(false);
document.getElementById('pclose').onclick=()=>select(null);
addEventListener('resize',render);render();
</script>
</body>
</html>
