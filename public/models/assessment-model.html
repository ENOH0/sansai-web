<!doctype html>
<html lang="th">

<head>
    <link rel="stylesheet" href="/fonts/th-sarabun.css">
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%
        }
    </style>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#fff">
    <meta name="description" content="MODEL การวัดและประเมินผลการเรียนรู้">
    <title>การวัดและประเมินผลการเรียนรู้</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237967dc'/%3E%3Ccircle cx='32' cy='32' r='16' fill='white'/%3E%3Cpath d='m24 32 6 6 11-13' fill='none' stroke='%237967dc' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
    <!-- ใช้ในด้านที่ 4 หัวข้อ 4.3 (ฝังเป็น iframe ใต้ตัวชี้วัด) · แก้เนื้อหาได้ที่ตัวแปร data ด้านล่าง -->
    <style>
        :root {
            --ink: #2e2a46;
            --muted: #6f6981;
            --violet: #7967dc;
            --shadow: 0 24px 70px rgba(76, 58, 128, .15)
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: transparent;
            color: var(--ink);
            font-family: 'TH SarabunPSK Web', 'TH SarabunPSK', Tahoma, sans-serif;
            font-size: 18px;
            line-height: 1.5;
            overflow-x: hidden
        }

        button {
            font: inherit
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes orbit {
            to {
                transform: rotateZ(360deg)
            }
        }

        @keyframes counter {
            from {
                transform: rotateZ(calc(-1 * var(--a)))
            }

            to {
                transform: rotateZ(calc(-360deg - var(--a)))
            }
        }

        @keyframes pulse {

            0%,
            100% {
                scale: 1;
                filter: brightness(1)
            }

            50% {
                scale: 1.08;
                filter: brightness(1.08)
            }
        }

        @keyframes core {

            0%,
            100% {
                transform: translate(-50%, -50%) rotateX(9deg) rotateY(-8deg)
            }

            50% {
                transform: translate(-50%, -53%) rotateX(-7deg) rotateY(10deg)
            }
        }

        @keyframes ring {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes bgshift {
            to {
                background-position: 200% center
            }
        }

        @keyframes shine {
            from {
                transform: translateX(-160%) skewX(-20deg)
            }

            to {
                transform: translateX(320%) skewX(-20deg)
            }
        }

        @keyframes modal {
            from {
                opacity: 0;
                transform: translateY(32px) scale(.88);
                filter: blur(7px)
            }

            to {
                opacity: 1;
                transform: none;
                filter: none
            }
        }

        .page {
            width: 100%;
            margin: auto;
            padding: 8px 4px 16px
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            margin-bottom: 22px;
            animation: rise .6s both
        }

        .eyebrow {
            margin: 0 0 4px;
            color: var(--violet);
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .12em
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4.8vw, 4rem);
            line-height: .95
        }

        h1 span {
            display: block;
            margin-top: .13em;
            background: linear-gradient(90deg, #7765d7, #ef79a4, #29b5ae, #7765d7);
            background-size: 200%;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            animation: bgshift 9s linear infinite
        }

        .intro {
            max-width: 500px;
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.33
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(650px, 1.18fr) minmax(390px, .82fr);
            gap: 22px;
            align-items: start
        }

        .model,
        .detail {
            background: #fff;
            border: 1px solid #ebe7f4;
            border-radius: 30px;
            box-shadow: var(--shadow)
        }

        .model {
            position: relative;
            min-height: 700px;
            padding: 24px;
            overflow: hidden;
            perspective: 1100px
        }

        .model:before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 30px;
            padding: 1px;
            background: linear-gradient(130deg, #f6b5cd, #c6bbff, #a4e6df, #ffe4aa);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            pointer-events: none
        }

        .model-head {
            position: relative;
            z-index: 8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px
        }

        .model-head h2 {
            margin: 0;
            font-size: 1.2rem
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .status {
            font-size: .7rem;
            color: #6c5cc5;
            background: #f7f5ff;
            border: 1px solid #e4dffc;
            border-radius: 999px;
            padding: 5px 12px
        }

        .toggle {
            border: 0;
            border-radius: 999px;
            padding: 6px 16px;
            background: #7967dc;
            color: #fff;
            font-size: .74rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(121, 103, 220, .25)
        }

        .scene {
            position: absolute;
            inset: 65px 0 0;
            transform-style: preserve-3d;
            perspective: 900px
        }

        .track {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 510px;
            height: 510px;
            translate: -50% -50%;
            border-radius: 50%;
            transform: rotateX(66deg);
            border: 4px solid rgba(121, 103, 220, .17);
            box-shadow: 0 0 0 14px rgba(121, 103, 220, .035), inset 0 0 42px rgba(121, 103, 220, .12)
        }

        .track:after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(transparent 0 55%, #7967dc 66%, #f17ba7 78%, #32b6ae 90%, transparent);
            padding: 5px;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            animation: ring 6s linear infinite
        }

        .orbit {
            position: absolute;
            z-index: 4;
            left: 50%;
            top: 50%;
            width: 490px;
            height: 490px;
            margin: -245px;
            transform-style: preserve-3d;
            animation: orbit 22s linear infinite
        }

        .model.paused .orbit,
        .model.paused .node,
        .model.paused .track:after {
            animation-play-state: paused
        }

        .wrap {
            --a: 0deg;
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            transform: rotateZ(var(--a)) translateY(-225px)
        }

        .wrap:nth-child(2) {
            --a: 120deg
        }

        .wrap:nth-child(3) {
            --a: 240deg
        }

        .node {
            position: absolute;
            left: -82px;
            top: -82px;
            width: 164px;
            height: 164px;
            border: 1px solid rgba(255, 255, 255, .82);
            border-radius: 50%;
            color: var(--ink);
            cursor: pointer;
            transform-style: preserve-3d;
            transform: rotateZ(calc(-1 * var(--a)));
            animation: counter 22s linear infinite;
            background: radial-gradient(circle at 32% 24%, #fff 0 17%, var(--soft) 56%, color-mix(in srgb, var(--tone) 28%, white));
            box-shadow: inset -12px -18px 28px color-mix(in srgb, var(--tone) 19%, transparent), inset 10px 10px 22px rgba(255, 255, 255, .8), 0 22px 35px var(--glow);
            transition: box-shadow .3s
        }

        .wrap:nth-child(1) .node {
            --tone: #ed719f;
            --soft: #ffe2ed;
            --glow: rgba(237, 113, 159, .28)
        }

        .wrap:nth-child(2) .node {
            --tone: #7c68dd;
            --soft: #e7e1ff;
            --glow: rgba(124, 104, 221, .28)
        }

        .wrap:nth-child(3) .node {
            --tone: #25aaa2;
            --soft: #d9faf5;
            --glow: rgba(37, 170, 162, .27)
        }

        .node:before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid color-mix(in srgb, var(--tone) 24%, white);
            border-radius: 50%
        }

        .node:after {
            content: "";
            position: absolute;
            left: 22%;
            top: 10%;
            width: 42%;
            height: 20%;
            border-radius: 50%;
            background: rgba(255, 255, 255, .65);
            filter: blur(3px);
            transform: rotate(-18deg)
        }

        .node .n {
            display: block;
            color: var(--tone);
            font-size: 2rem;
            font-weight: 900;
            line-height: .8
        }

        .node strong {
            position: relative;
            z-index: 2;
            display: block;
            font-size: 1.18rem;
            line-height: 1;
            margin-top: 9px
        }

        .node small {
            position: relative;
            z-index: 2;
            display: block;
            margin-top: 7px;
            color: #686176;
            font-size: .66rem
        }

        .node.active {
            outline: 5px solid color-mix(in srgb, var(--tone) 22%, transparent);
            outline-offset: 7px;
            animation: counter 22s linear infinite, pulse 1.8s ease-in-out infinite
        }

        .node:focus-visible {
            outline: 5px solid color-mix(in srgb, var(--tone) 35%, white);
            outline-offset: 5px
        }

        .core {
            position: absolute;
            z-index: 5;
            left: 50%;
            top: 50%;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            display: grid;
            place-content: center;
            text-align: center;
            background: radial-gradient(circle at 33% 24%, #fff, #f0edff 58%, #cfc5fb);
            border: 1px solid #d7d0f4;
            box-shadow: inset -20px -24px 35px rgba(121, 103, 220, .16), inset 12px 12px 26px #fff, 0 35px 60px rgba(90, 69, 155, .24);
            animation: core 5s ease-in-out infinite
        }

        .core:before,
        .core:after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(121, 103, 220, .22)
        }

        .core:before {
            inset: -19px
        }

        .core:after {
            inset: -34px;
            border-style: dashed;
            animation: ring 16s linear infinite
        }

        .core strong {
            font-size: 2.35rem;
            line-height: .82;
            color: #715fd0;
            text-shadow: 0 4px 12px rgba(113, 95, 208, .2)
        }

        .core span {
            display: block;
            margin-top: 12px;
            font-weight: 800;
            line-height: 1.12
        }

        .core small {
            display: block;
            margin-top: 9px;
            color: #756d8b;
            font-size: .65rem
        }

        .shadow {
            position: absolute;
            z-index: 1;
            left: 50%;
            top: 73%;
            width: 430px;
            height: 95px;
            translate: -50% 0;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(71, 55, 119, .23), transparent 68%);
            filter: blur(10px)
        }

        .detail {
            --tone: #ed719f;
            position: relative;
            min-height: 650px;
            padding: 29px;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .detail>* {
            animation: rise .4s both
        }

        .detail-top {
            display: flex;
            gap: 14px;
            align-items: flex-start
        }

        .detail-num {
            width: 54px;
            height: 54px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, #fff, var(--tone));
            color: #fff;
            font-size: 1.45rem;
            font-weight: 900;
            box-shadow: 0 11px 26px color-mix(in srgb, var(--tone) 28%, transparent)
        }

        .detail small {
            display: block;
            color: var(--tone);
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .08em
        }

        .detail h2 {
            margin: 2px 0 0;
            font-size: 1.55rem;
            line-height: 1.08
        }

        .copy {
            margin: 20px 0 14px;
            color: #504a61;
            line-height: 1.48
        }

        .detail h4 {
            margin: 0 0 8px;
            color: var(--tone);
            font-size: .88rem
        }

        .points {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none
        }

        .points button {
            position: relative;
            width: 100%;
            padding: 11px 13px 11px 31px;
            border: 1px solid #ece9f2;
            border-radius: 14px;
            background: #fff;
            color: var(--ink);
            text-align: left;
            line-height: 1.25;
            cursor: pointer;
            transition: .2s
        }

        .points button:before {
            content: "";
            position: absolute;
            left: 13px;
            top: 1.02em;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--tone);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--tone) 12%, white)
        }

        .points li.open button {
            border-color: var(--tone);
            background: color-mix(in srgb, var(--tone) 6%, white);
            color: var(--tone)
        }

        @media (hover:hover) {
            .points button:hover {
                border-color: var(--tone);
                background: color-mix(in srgb, var(--tone) 6%, white);
                color: var(--tone)
            }
        }

        .answer {
            display: none;
            margin: 5px 3px 0;
            padding: 9px 14px;
            border-left: 3px solid var(--tone);
            border-radius: 0 11px 11px 0;
            background: color-mix(in srgb, var(--tone) 6%, white);
            color: #615b70;
            font-size: .82rem;
            line-height: 1.36
        }

        .points li.open .answer {
            display: block;
            animation: rise .3s both
        }

        .open {
            margin-top: auto;
            align-self: flex-start;
            position: relative;
            overflow: hidden;
            border: 0;
            border-radius: 14px;
            padding: 10px 20px;
            background: var(--tone);
            color: #fff;
            font-weight: 800;
            font-size: .85rem;
            cursor: pointer;
            box-shadow: 0 10px 24px color-mix(in srgb, var(--tone) 28%, transparent)
        }

        .open:after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent);
            animation: shine 2.7s ease-in-out infinite
        }

        dialog {
            width: min(800px, calc(100% - 28px));
            max-height: 680px;
            padding: 0;
            border: 0;
            border-radius: 28px;
            background: #fff;
            color: var(--ink);
            box-shadow: 0 35px 100px rgba(45, 34, 80, .35);
            overflow: hidden
        }

        dialog::backdrop {
            background: rgba(41, 35, 65, .45);
            backdrop-filter: blur(8px)
        }

        dialog[open] {
            animation: modal .42s cubic-bezier(.16, 1, .3, 1) both
        }

        .bar {
            height: 8px;
            background: linear-gradient(90deg, var(--tone), color-mix(in srgb, var(--tone) 50%, white), var(--tone));
            background-size: 200%;
            animation: bgshift 5s linear infinite
        }

        .modal-body {
            padding: clamp(24px, 5vw, 40px);
            max-height: 672px;
            overflow: auto
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px
        }

        .modal-head p {
            margin: 0;
            color: var(--tone);
            font-weight: 800
        }

        .modal-head h2 {
            margin: 3px 0 0;
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            line-height: 1.05
        }

        .close {
            border: 1px solid #e5e1ed;
            border-radius: 999px;
            background: #f8f7fb;
            color: #554f67;
            padding: 6px 16px;
            font-size: .76rem;
            font-weight: 800;
            cursor: pointer
        }

        .modal-copy {
            margin: 20px 0
        }

        .modal-list {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none
        }

        .modal-list li {
            padding: 13px 16px;
            border-left: 5px solid var(--tone);
            border-radius: 6px 14px 14px 6px;
            background: color-mix(in srgb, var(--tone) 8%, white)
        }

        footer {
            text-align: center;
            padding-top: 20px;
            color: var(--muted);
            font-size: .72rem
        }

        @media(max-width:1080px) {
            header {
                align-items: flex-start;
                flex-direction: column
            }

            .workspace {
                grid-template-columns: 1fr
            }

            .detail {
                position: relative;
                top: auto
            }

            .model {
                min-height: 690px
            }
        }

        @media(max-width:650px) {
            body {
                font-size: 19px
            }

            .page {
                padding: 21px 11px 30px
            }

            .model,
            .detail {
                border-radius: 23px
            }

            .model {
                min-height: 520px;
                padding: 14px
            }

            .status {
                display: none
            }

            .scene {
                inset: 62px 0 0;
                scale: .68
            }

            .detail {
                padding: 22px;
                min-height: 560px
            }

            .node {
                width: 150px;
                height: 150px;
                left: -75px;
                top: -75px
            }

            .core {
                width: 210px;
                height: 210px
            }

            .model-head h2 {
                font-size: 1rem
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *:before,
            *:after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important
            }
        }

        /* Keep orbit lines behind all readable content */
        .scene {
            isolation: isolate
        }

        .track {
            z-index: 0;
            width: 430px;
            height: 430px;
            opacity: .34;
            pointer-events: none
        }

        .track:after {
            opacity: .46
        }

        .shadow {
            z-index: 0
        }

        .orbit {
            z-index: 3
        }

        .core {
            z-index: 5
        }

        .node {
            z-index: 2;
            background: radial-gradient(circle at 32% 24%, #fff 0 20%, var(--soft) 58%, color-mix(in srgb, var(--tone) 28%, white) 100%)
        }

        .node:before {
            z-index: -1
        }

        .node>* {
            position: relative;
            z-index: 3
        }

        @media(max-width:650px) {
            .track {
                width: 390px;
                height: 390px
            }
        }

        .toggle,
        .close,
        .open,
        .points button {
            min-height: 44px
        }

        @media(max-width:1080px) {
            .detail {
                min-height: 0
            }

            .open {
                margin-top: 22px
            }
        }

        /* พื้นหลังโปร่งใสเฉพาะกรอบวงหมุน ให้โมเดลลอยบนวิดีโอพื้นหลังของหน้า */
        .model {
            background: transparent;
            border-color: transparent;
            box-shadow: none
        }

        .model:before {
            display: none
        }

        .model-head h2 {
            color: #fff;
            text-shadow: 0 2px 12px rgba(8, 21, 47, .9)
        }

        .track {
            opacity: .6
        }

        .shadow {
            opacity: .55
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="workspace" aria-label="โมเดลการวัดและประเมินผลการเรียนรู้ 3 ด้าน">
            <div class="model">
                <div class="model-head">
                    <h2>3 หลักการสำคัญ</h2>
                    <div class="controls"><span class="status" id="status">กำลังหมุนอัตโนมัติ</span><button
                            class="toggle" id="toggle" type="button">หยุด</button></div>
                </div>
                <div class="scene">
                    <div class="shadow"></div>
                    <div class="track"></div>
                    <div class="orbit" id="orbit"></div>
                    <div class="core">
                        <strong>กระบวนการ</strong><span>การวัดและ<br>ประเมินผลการเรียนรู้</span><small>ประเมินเพื่อพัฒนา
                            •
                            ต่อเนื่อง • รายบุคคล</small>
                    </div>
                </div>
            </div>
            <aside class="detail" id="detail" aria-live="polite"></aside>
        </section>
    </main>
    <dialog id="modal" aria-labelledby="modalTitle">
        <div class="bar"></div>
        <div class="modal-body">
            <div class="modal-head">
                <div>
                    <p id="modalKicker"></p>
                    <h2 id="modalTitle"></h2>
                </div><button class="close" type="button">ปิด</button>
            </div>
            <p class="modal-copy" id="modalCopy"></p>
            <ul class="modal-list" id="modalList"></ul>
        </div>
    </dialog>
    <script>
        const data = [
            { title: 'ยืดหยุ่น', tag: 'ปรับการเรียนรู้ให้เหมาะกับผู้เรียน', tone: '#ed719f', copy: 'ปรับเวลา วิธีเรียน กิจกรรม และการประเมินให้สอดคล้องกับความพร้อม ความแตกต่างด้านความสามารถและขีดจำกัดของผู้เรียน เช่น มีปัญหาด้านสุขภาพกาย/จิต ครอบครัว เศรษฐกิจ และข้อจำกัดด้านเวลา ช่วยเพิ่มโอกาสในการเรียนรู้ โดยยังคงเป้าหมายการเรียนรู้และมาตรฐานที่กำหนด', points: [['ปรับเวลาและวิธีเรียน', 'ยืดหยุ่นช่วงเวลา ลำดับ และวิธีเรียนตามความพร้อมของผู้เรียน โดยไม่ลดเป้าหมายหรือมาตรฐาน'], ['ทบทวนและเรียนเสริม', 'เปิดโอกาสให้นักเรียนทบทวนบทเรียนออนไลน์หรือเข้าร่วมการเรียนเสริมได้ตามความจำเป็น'], ['เลือกวิธีแสดงความรู้', 'ให้นักเรียนเลือกนำเสนอความรู้ผ่านการเขียน การพูด หรือการสร้างชิ้นงานตามความถนัด']] },
            { title: 'หลากหลาย', tag: 'เปิดทางเลือกและพัฒนาศักยภาพ', tone: '#7c68dd', copy: 'จัดเนื้อหา กิจกรรม สื่อ และแหล่งเรียนรู้หลายรูปแบบโดยมีการใช้เทคโนโลยีเข้ามามีส่วนร่วม เพื่อรองรับความสนใจและความสามารถที่แตกต่างกัน พร้อมใช้วิธีประเมินที่สะท้อนความสามารถได้หลายด้าน', points: [['กิจกรรมหลายรูปแบบ', 'ใช้โครงงาน การลงมือปฏิบัติ และการเรียนรู้ในชุมชนเพื่อเปิดประสบการณ์ที่แตกต่าง'], ['พัฒนาความถนัดรอบด้าน', 'จัดกิจกรรมด้านภาษา ศิลปะ กีฬา เทคโนโลยี และอาชีพให้ผู้เรียนค้นพบและพัฒนาศักยภาพ'], ['ประเมินหลายวิธี', 'ใช้ชิ้นงาน การสังเกต การนำเสนอ ภาระงาน และการประเมินตามสภาพจริงให้เหมาะกับสิ่งที่ต้องการวัด ทั้งรูปแบบออนไลน์และออฟไลน์']] },
            { title: 'ยุติธรรม', tag: 'ให้โอกาสและความช่วยเหลือที่เหมาะสม', tone: '#25aaa2', copy: 'จัดสรรทรัพยากรและความช่วยเหลือตามความจำเป็นของผู้เรียน ลดอุปสรรคจากฐานะ ความพิการ หรือข้อจำกัดในการเข้าถึงการเรียนรู้ พร้อมประเมินอย่างโปร่งใสและไม่เลือกปฏิบัติ โดยเปิดโอกาสให้นักเรียนผู้ปกครองได้มีส่วนร่วมในการประเมินผล', points: [['ลดอุปสรรคในการเข้าถึง', 'ให้ยืมอุปกรณ์ดิจิทัล จัดสื่อที่เข้าถึงได้ และสนับสนุนผู้เรียนตามความจำเป็น'], ['ช่วยเหลืออย่างเหมาะสม', 'ดูแลนักเรียนที่ต้องการความช่วยเหลือเพิ่มเติมด้วยแนวทางเฉพาะบุคคล'], ['เกณฑ์ชัดเจนและโปร่งใส', 'สื่อสารเกณฑ์การประเมินล่วงหน้า ใช้หลักฐานที่เหมาะสม และประเมินโดยไม่เลือกปฏิบัติ']] }
        ];
        const orbit = document.getElementById('orbit'), detail = document.getElementById('detail'), modal = document.getElementById('modal'), toggle = document.getElementById('toggle'), statusEl = document.getElementById('status'); let active = 0, playing = true, timer;
        data.forEach((item, i) => { const w = document.createElement('div'); w.className = 'wrap'; const b = document.createElement('button'); b.type = 'button'; b.className = 'node'; b.style.setProperty('--a', `${i * 120}deg`); b.innerHTML = `<span class="n">${['1', '2', '3'][i]}</span><strong>${item.title}</strong><small>${item.tag}</small>`; b.addEventListener('click', () => { select(i, true); stop() }); w.appendChild(b); orbit.appendChild(w) });
        function select(i, popup = false) { active = i; const d = data[i]; document.querySelectorAll('.node').forEach((n, x) => n.classList.toggle('active', x === i)); detail.style.setProperty('--tone', d.tone); detail.innerHTML = `<div class="detail-top"><span class="detail-num">${['1', '2', '3'][i]}</span><div><small>หลักการที่ ${i + 1} จาก 3</small><h2>${d.title} — ${d.tag}</h2></div></div><p class="copy">${d.copy}</p><h4>คลิกเพื่อดูข้อมูลย่อย</h4><ul class="points">${d.points.map((p, x) => `<li><button type="button" data-point="${x}" aria-expanded="false">${p[0]}</button><div class="answer">${p[1]}</div></li>`).join('')}</ul><button class="open" type="button">เปิดอ่านข้อมูลทั้งหมด</button>`; detail.querySelectorAll('[data-point]').forEach(b => b.addEventListener('click', () => { const li = b.parentElement, on = li.classList.toggle('open'); b.setAttribute('aria-expanded', String(on)) })); detail.querySelector('.open').addEventListener('click', openModal); if (popup) openModal() }
        function openModal() { clearTimeout(timer); const d = data[active]; modal.style.setProperty('--tone', d.tone); document.getElementById('modalKicker').textContent = `หลักการที่ ${active + 1} จาก 3`; document.getElementById('modalTitle').textContent = `${d.title} — ${d.tag}`; document.getElementById('modalCopy').textContent = d.copy; document.getElementById('modalList').innerHTML = d.points.map(p => `<li><strong>${p[0]}</strong><br>${p[1]}</li>`).join(''); const anchor = document.querySelector('.detail'); const top = Math.max(12, Math.min((anchor ? anchor.getBoundingClientRect().top + window.scrollY : 12), document.body.scrollHeight - 700)); modal.style.margin = top + 'px auto auto'; modal.showModal(); if (window.parent !== window) window.parent.postMessage({ type: 'd4-assessment-model-scroll', top, bottom: top + modal.getBoundingClientRect().height }, window.location.origin) }
        function schedule() { clearTimeout(timer); if (!playing || modal.open) return; timer = setTimeout(() => { select((active + 1) % 3); schedule() }, 6000) } function start() { playing = true; document.querySelector('.model').classList.remove('paused'); toggle.textContent = 'หยุด'; statusEl.textContent = 'กำลังหมุนอัตโนมัติ'; schedule() } function stop() { playing = false; clearTimeout(timer); document.querySelector('.model').classList.add('paused'); toggle.textContent = 'หมุนต่อ'; statusEl.textContent = 'หยุดเพื่ออ่านรายละเอียด' }
        toggle.addEventListener('click', () => playing ? stop() : start()); modal.querySelector('.close').addEventListener('click', () => modal.close()); modal.addEventListener('click', e => { const r = modal.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) modal.close() }); modal.addEventListener('close', () => { if (playing) schedule() }); document.addEventListener('keydown', e => { if (!modal.open && '123'.includes(e.key)) { select(Number(e.key) - 1, true); stop() } }); function reportHeight() { requestAnimationFrame(() => { const page = document.querySelector('.page'); const height = Math.ceil(page ? page.getBoundingClientRect().height + 8 : document.body.scrollHeight); if (window.parent !== window) window.parent.postMessage({ type: 'd4-assessment-model-height', height }, window.location.origin) }) }
        new ResizeObserver(reportHeight).observe(document.body); window.addEventListener('load', reportHeight);
        select(0); start();
    </script>
</body>

</html>
