<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK-GEP</title>
  <link rel="stylesheet" href="/fonts/th-sarabun.css">
  <style>
    
    :root{--ink:#163a79}*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;padding:12px 8px;background:transparent;font-family:'TH SarabunPSK Web',sans-serif}.journey{width:min(1240px,96vw);display:grid;grid-template-columns:minmax(140px,210px) 40px minmax(430px,600px) 40px minmax(170px,250px);justify-content:center;align-items:center;gap:8px}.stage-card{padding:15px 20px;text-align:center;border-radius:18px;background:#fff;border:2px solid #d6e5f7;box-shadow:0 7px 15px #315b8c18;color:var(--ink);font:600 clamp(1.35rem,2.8vw,1.75rem)/1.35 'TH SarabunPSK Web',sans-serif}.stage-card.goal{border-color:#f2c45a;background:#fffaf0}.flow-arrow{color:#e6ad26;font:700 2.2rem/1 'TH SarabunPSK Web',sans-serif;animation:slide 2.4s ease-in-out infinite;text-align:center}.model{width:min(620px,100%);aspect-ratio:1}.model svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 20px 26px #315b8c24)}.arc{fill:none;stroke-width:184;stroke-linecap:butt;transition:filter .25s ease}.sector{cursor:pointer;outline:none}.sector:hover .arc,.sector:focus .arc{filter:brightness(1.06) saturate(1.08)}.sector:focus-visible .arc{stroke:#163a79;stroke-width:190}.label{fill:var(--ink);text-anchor:middle;pointer-events:none}.name{font:700 29px 'TH SarabunPSK Web',sans-serif}.p-name{font-size:26px}.thai{font:600 19px 'TH SarabunPSK Web',sans-serif}.icon-box{filter:drop-shadow(0 5px 6px #2b57872c);pointer-events:none}.icon-letter{fill:#fff;text-anchor:middle;font:700 36px 'TH SarabunPSK Web',sans-serif}.hub{filter:drop-shadow(0 12px 15px #294c7833)}.hub circle{fill:#fff;stroke:#c8ddf6;stroke-width:4}.hub-title{fill:var(--ink);text-anchor:middle;font:700 54px 'TH SarabunPSK Web',sans-serif;letter-spacing:1px}.hub-sub{fill:#607ba8;text-anchor:middle;font:700 20px 'TH SarabunPSK Web',sans-serif}.hub-via{fill:#d99a12;text-anchor:middle;font:700 26px 'TH SarabunPSK Web',sans-serif}.hub-line{stroke:#efa916;stroke-width:4;stroke-linecap:round}.shine{fill:none;stroke:#fff;stroke-width:3;opacity:.72}.spark{fill:#fff;opacity:.76;animation:twinkle 3s ease-in-out infinite alternate}.spark.two{animation-delay:-1.3s}.spark.three{animation-delay:-2.1s}@keyframes twinkle{to{opacity:.2;transform:scale(.75);transform-origin:center}}@keyframes slide{50%{transform:translateX(5px)}}.mid{display:flex;flex-direction:column;align-items:center;width:100%}.via{margin-bottom:-6px;padding:6px 24px;border-radius:999px;background:#fff;border:2px solid #f2c45a;box-shadow:0 6px 14px #315b8c18;color:#163a79;font:700 clamp(1.5rem,3vw,1.9rem)/1.3 'TH SarabunPSK Web',sans-serif;position:relative;z-index:1}.via b{color:#d99a12}@media(max-width:900px){.journey{grid-template-columns:1fr;justify-items:center;gap:8px}.stage-card{max-width:500px;text-align:center}.flow-arrow{transform:rotate(90deg)}.model{width:min(640px,94vw)}}@media(max-width:520px){.stage-card{padding:10px 17px}.stage-card.goal{white-space:normal}.name{font-size:22px}.p-name{font-size:20px}.thai{font-size:16px}.hub-title{font-size:46px}.hub-sub{font-size:16px}.icon-letter{font-size:28px}}@media(prefers-reduced-motion:reduce){.spark,.flow-arrow{animation:none}}
  </style>
</head>
<body>
  <div class="journey"><div class="stage-card">สร้างพื้นฐาน</div><div class="flow-arrow" aria-hidden="true">→</div>
  <div class="mid"><main class="model" aria-label="โมเดล SK-GEP">
    <svg viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
      <title id="title">SK-GEP อัตลักษณ์นักเรียน</title><desc id="desc">วงล้อห้าด้าน ได้แก่ Smile, Karawa, Greeting, Excellent Dress และ Public Mind</desc>
      <circle cx="360" cy="360" r="276" fill="#fff" stroke="#d7e5f6" stroke-width="8"></circle>
      <g class="sector" tabindex="0" role="button" aria-label="S Smile ยิ้มแย้มแจ่มใส"><circle class="arc" cx="360" cy="360" r="226" stroke="#ffd45a" stroke-dasharray="270 1150" transform="rotate(-126 360 360)"></circle><g class="icon-box"><rect x="331" y="92" width="58" height="58" rx="18" fill="#f3ba27"></rect><text class="icon-letter" x="360" y="131">☺</text></g><text class="label name" x="360" y="187">S · Smile</text><text class="label thai" x="360" y="209">ยิ้มแย้มแจ่มใส</text></g>
      <g class="sector" tabindex="0" role="button" aria-label="K Karawa ไหว้ มีสัมมาคารวะ"><circle class="arc" cx="360" cy="360" r="226" stroke="#75dca0" stroke-dasharray="270 1150" transform="rotate(-54 360 360)"></circle><g class="icon-box"><rect x="518" y="223" width="58" height="58" rx="18" fill="#45bd7d"></rect><text class="icon-letter" x="547" y="262">K</text></g><text class="label name" x="538" y="319">K · Karawa</text><text class="label thai" x="538" y="341">ไหว้ มีสัมมาคารวะ</text></g>
      <g class="sector" tabindex="0" role="button" aria-label="G Greeting ทักทายด้วยไมตรีจิต"><circle class="arc" cx="360" cy="360" r="226" stroke="#79bdf1" stroke-dasharray="270 1150" transform="rotate(18 360 360)"></circle><g class="icon-box"><rect x="447" y="468" width="58" height="58" rx="18" fill="#4a9fdb"></rect><text class="icon-letter" x="476" y="507">G</text></g><text class="label name" x="478" y="551">G · Greeting</text><text class="label thai" x="478" y="573">ทักทายด้วยไมตรีจิต</text></g>
      <g class="sector" tabindex="0" role="button" aria-label="E Excellent Dress แต่งกายดี มีระเบียบวินัย"><circle class="arc" cx="360" cy="360" r="226" stroke="#aca1f1" stroke-dasharray="270 1150" transform="rotate(90 360 360)"></circle><g class="icon-box"><rect x="215" y="468" width="58" height="58" rx="18" fill="#8a7be2"></rect><text class="icon-letter" x="244" y="507">E</text></g><text class="label name" x="242" y="551">E · Excellent Dress</text><text class="label thai" x="242" y="573">แต่งกายดี มีระเบียบวินัย</text></g>
      <g class="sector" tabindex="0" role="button" aria-label="P Public Mind มีจิตสาธารณะ"><circle class="arc" cx="360" cy="360" r="226" stroke="#f6a7bc" stroke-dasharray="270 1150" transform="rotate(162 360 360)"></circle><g class="icon-box"><rect x="144" y="223" width="58" height="58" rx="18" fill="#ef7898"></rect><text class="icon-letter" x="173" y="262">♥</text></g><text class="label name p-name" x="157" y="319">P · Public Mind</text><text class="label thai" x="157" y="341">มีจิตสาธารณะ</text></g>
      <circle class="shine" cx="360" cy="360" r="267"></circle><circle class="spark" cx="120" cy="300" r="6"></circle><circle class="spark two" cx="584" cy="268" r="6"></circle><circle class="spark three" cx="486" cy="594" r="5"></circle>
      <g class="hub"><circle cx="360" cy="360" r="104"></circle><circle cx="360" cy="360" r="88" fill="none" stroke="#edae1e" stroke-width="1.5"></circle><text class="hub-via" x="360" y="322">ผ่านวิถี</text><text class="hub-title" x="360" y="370">SK-GEP</text><text class="hub-sub" x="360" y="396">อัตลักษณ์นักเรียน</text><line class="hub-line" x1="329" x2="391" y1="414" y2="414"></line></g>
    </svg>
  </main></div><div class="flow-arrow" aria-hidden="true">→</div><div class="stage-card goal">สู่คุณภาพผู้เรียนที่มีอัตลักษณ์</div></div>
<script>
(function(){let last=0;const j=document.querySelector('.journey');function send(){const h=Math.ceil(j.getBoundingClientRect().height+40);if(Math.abs(h-last)<2)return;last=h;parent.postMessage({type:'d1-skgep-height',height:h},location.origin)}
new ResizeObserver(send).observe(j);addEventListener('load',send);setTimeout(send,500)})();
</script>
</body>
</html>
