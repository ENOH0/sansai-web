<section class="wl" [class.is-menu]="menuOpen()" (click)="!menuOpen() && openMenu()">
  <!-- วิดีโอปก วนลูป · ไฟล์อยู่ที่ public/video/welcome-cover-v3.mp4 -->
  <video #cover class="wl-video" autoplay muted loop playsinline webkit-playsinline disablepictureinpicture preload="auto"
         poster="/video/welcome-cover-v3.jpg" aria-hidden="true">
    <source src="/video/welcome-cover-v3.mp4" type="video/mp4" />
  </video>
  <div class="wl-shade"></div>

  <!-- ภาพพักหน้าจอ: แสดงแค่วิดีโอ แตะตรงไหนก็ได้เพื่อเปิดเมนู -->
  <span class="wl-sr" *ngIf="!menuOpen()">แตะหน้าจอเพื่อเริ่มต้น</span>

  <!-- เมนู 5 ปุ่ม -->
  <div class="wl-menu" *ngIf="menuOpen()" role="dialog" aria-label="เมนูหลัก">
    <img class="wl-menu-logo" src="school-logo.png" alt="" />
    <h1 class="wl-title">ยินดีต้อนรับคณะกรรมการ</h1>
    <p class="wl-lead">{{ school.name }} · {{ school.award }}</p>

    <nav class="wl-grid">
      <ng-container *ngFor="let b of buttons; let i = index">
        <a *ngIf="b.link && !isExternal(b.link)" class="wl-btn" [class.is-main]="b.main" [routerLink]="b.link"
           [style.--i]="i">
          <ng-container *ngTemplateOutlet="btnBody; context: { $implicit: b }"></ng-container>
        </a>
        <a *ngIf="b.link && isExternal(b.link)" class="wl-btn" [class.is-main]="b.main" [href]="b.link"
           target="_blank" rel="noopener" [style.--i]="i">
          <ng-container *ngTemplateOutlet="btnBody; context: { $implicit: b }"></ng-container>
        </a>
        <span *ngIf="!b.link" class="wl-btn is-empty" aria-disabled="true" [style.--i]="i">
          <ng-container *ngTemplateOutlet="btnBody; context: { $implicit: b }"></ng-container>
          <em class="wl-soon">เร็ว ๆ นี้</em>
        </span>
      </ng-container>
    </nav>

    <button type="button" class="wl-back" (click)="closeMenu($event)">กลับสู่หน้าปก</button>
  </div>
</section>

<ng-template #btnBody let-b>
  <span class="wl-ico" [ngSwitch]="b.icon" aria-hidden="true">
    <svg *ngSwitchCase="'calendar'" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"/></svg>
    <svg *ngSwitchCase="'video'" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="14" height="13" rx="2.5"/><path d="m16.5 10 5-3v10l-5-3z"/></svg>
    <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>
    <svg *ngSwitchCase="'food'" viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 0 0 4 0V3M8 11v10M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v3H17"/></svg>
    <svg *ngSwitchCase="'map'" viewBox="0 0 24 24"><path d="m3 6 6-2.5 6 2.5 6-2.5v14.5L15 20.5 9 18l-6 2.5z"/><path d="M9 3.5V18M15 6v14.5"/></svg>
  </span>
  <span class="wl-label">{{ b.label }}</span>
  <span class="wl-sub2">{{ b.sub }}</span>
</ng-template>
