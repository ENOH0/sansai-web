<!-- ภาพพื้นหลัง ตรึงเต็มจอตลอดทั้งหน้า -->
<div class="cover-bg" aria-hidden="true">
  <div class="cover-media">
    <div class="cover-slide" *ngFor="let s of slides; let i = index"
         [class.is-on]="current() === i" [style.background-image]="'url(' + s + ')'"></div>
  </div>
  <div class="cover-veil"></div>
</div>

<!-- ═══════════ หน้าปก ═══════════ -->
<section class="cover">
  <div class="cover-inner">
    <p class="cover-eyebrow">{{ school.award }} · {{ school.level }}</p>
    <h1 class="cover-title">{{ school.name }}</h1>
    <div class="cover-rule"></div>
    <p class="cover-sub">
      เอกสารประกอบการประเมินสถานศึกษา {{ school.academicYear }}<br />
      {{ school.area }}
    </p>
    <a class="cover-cta" routerLink="/dimension-1">เริ่มดูข้อมูลด้านที่ 1</a>
  </div>

  <a class="cover-scroll" href="#contents" aria-label="เลื่อนลงดูสารบัญ">
    <span>สารบัญ</span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 5v14M5 12l7 7 7-7" />
    </svg>
  </a>
</section>

<!-- ═══════════ สารบัญ ═══════════ -->
<section class="section contents" id="contents">
  <div class="wrap">
    <div class="sec-head" appReveal>
      <h2 class="sec-title">สารบัญ</h2>
      <div class="sec-rule"></div>
    </div>

    <div class="toc">
      <ng-container *ngFor="let l of links; let i = index">
        <a class="toc-card" *ngIf="l.path" [routerLink]="l.path"
           appReveal="zoom" [revealDelay]="i * 70">
          <ng-container *ngTemplateOutlet="card; context: { $implicit: l }" />
        </a>
        <a class="toc-card" *ngIf="l.url" [href]="l.url" target="_blank" rel="noopener"
           appReveal="zoom" [revealDelay]="i * 70">
          <ng-container *ngTemplateOutlet="card; context: { $implicit: l }" />
        </a>
      </ng-container>
    </div>
  </div>
</section>

<ng-template #card let-l>
  <span class="toc-photo" [style.background-image]="'url(' + l.image + ')'" aria-hidden="true"></span>
  <span class="toc-body">
    <span class="toc-top">
      <span class="toc-no">{{ l.no }}</span>
      <span class="toc-weight" *ngIf="l.weight">น้ำหนัก {{ l.weight }} คะแนน</span>
    </span>
    <span class="toc-name">{{ l.name }}</span>
    <span class="toc-sub">{{ l.sub }}</span>
    <span class="toc-go">เปิดดู
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7" />
      </svg>
    </span>
  </span>
</ng-template>
