<div class="chart-card" appReveal>
  <div class="chart-head">
    <div>
      <div class="chart-title">{{ title }}</div>
      <div class="chart-sub" *ngIf="subtitle">{{ subtitle }}</div>
    </div>
  </div>

  <svg class="chart-svg" [attr.viewBox]="'0 0 ' + W + ' ' + H"
       preserveAspectRatio="xMidYMid meet" role="img" [attr.aria-label]="title">

    <g *ngFor="let t of ticks()">
      <line class="grid-line" [attr.x1]="PL" [attr.x2]="W - PR"
            [attr.y1]="yPos(t)" [attr.y2]="yPos(t)" />
      <text class="axis-text" [attr.x]="PL - 10" [attr.y]="yPos(t) + 4"
            text-anchor="end">{{ t }}</text>
    </g>

    <line class="axis-line" [attr.x1]="PL" [attr.x2]="W - PR"
          [attr.y1]="H - PB" [attr.y2]="H - PB" />

    <g *ngFor="let lb of labels; let gi = index">
      <g *ngFor="let s of series; let si = index">
        <rect class="bar-rect"
              [attr.x]="barX(gi, si)"
              [attr.y]="yPos(s.values[gi])"
              [attr.width]="barW()"
              [attr.height]="Math.max(0, H - PB - yPos(s.values[gi]))"
              [attr.fill]="colorOf(s, si)"
              rx="4"
              [style.animation-delay]="(gi * 110 + si * 70) + 'ms'" />
        <text class="axis-text" *ngIf="showValues"
              [attr.x]="barX(gi, si) + barW() / 2"
              [attr.y]="yPos(s.values[gi]) - 8"
              text-anchor="middle" style="font-weight:700"
              [attr.fill]="colorOf(s, si)">{{ s.values[gi] | number: valueFormat }}</text>
      </g>
      <text class="axis-text b" [attr.x]="groupCenter(gi)" [attr.y]="H - PB + 26"
            text-anchor="middle">{{ lb }}</text>
    </g>
  </svg>

  <div class="chart-legend">
    <span class="legend-item" *ngFor="let s of series; let si = index">
      <span class="legend-swatch dot" [style.background]="colorOf(s, si)"></span>{{ s.name }}
    </span>
  </div>

  <p class="chart-note" *ngIf="note">{{ note }}</p>
</div>
