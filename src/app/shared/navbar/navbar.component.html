<header class="nav" [class.is-scrolled]="scrolled()">
  <div class="wrap-wide nav-inner">
    <a class="brand" routerLink="/" (click)="close()">
      <img class="brand-mark" src="school-logo.png" alt="ตราโรงเรียนสันทรายวิทยาคม" />
      <span class="brand-text">
        <span class="brand-name">{{ school.name }}</span>
        <span class="brand-sub">{{ school.award }} · {{ school.level }}</span>
      </span>
    </a>

    <nav class="nav-links">
      <a *ngFor="let item of items"
         class="nav-link"
         [routerLink]="item.path"
         routerLinkActive="is-active"
         [routerLinkActiveOptions]="{ exact: item.path === '/' }">{{ item.short }}</a>

      <a class="nav-link" [href]="evalLink.url" target="_blank" rel="noopener"
         [attr.aria-label]="evalLink.label">{{ evalLink.short }}</a>
    </nav>

    <button class="nav-toggle" type="button"
            (click)="toggle()"
            [attr.aria-expanded]="open()"
            aria-label="เปิดเมนู">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <ng-container *ngIf="!open()">
          <line x1="3" y1="7" x2="21" y2="7" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="17" x2="21" y2="17" />
        </ng-container>
        <ng-container *ngIf="open()">
          <line x1="5" y1="5" x2="19" y2="19" />
          <line x1="19" y1="5" x2="5" y2="19" />
        </ng-container>
      </svg>
    </button>
  </div>
</header>

<div class="progress" [style.width.%]="progress()"></div>

<nav class="nav-drawer" *ngIf="open()">
  <a *ngFor="let item of items"
     class="nav-link"
     [routerLink]="item.path"
     routerLinkActive="is-active"
     [routerLinkActiveOptions]="{ exact: item.path === '/' }"
     (click)="close()">{{ item.label }}</a>

  <a class="nav-link" [href]="evalLink.url" target="_blank" rel="noopener"
     (click)="close()">{{ evalLink.label }}</a>
</nav>
