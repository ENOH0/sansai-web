<div class="chart-card" appReveal>
  <div class="chart-head">
    <div>
      <div class="chart-title">{{ title }}</div>
      <div class="chart-sub" *ngIf="subtitle">{{ subtitle }}</div>
    </div>
  </div>

  <svg class="chart-svg" [attr.viewBox]="'0 0 ' + W + ' ' + H"
       preserveAspectRatio="xMidYMid meet" role="img" [attr.aria-label]="title">

    <!-- เส้นตารางแนวนอน + ป้ายแกน Y -->
    <g>
      <g *ngFor="let t of ticks()">
        <line class="grid-line" [attr.x1]="PL" [attr.x2]="W - PR"
              [attr.y1]="yPos(t)" [attr.y2]="yPos(t)" />
        <text class="axis-text" [attr.x]="PL - 10" [attr.y]="yPos(t) + 4"
              text-anchor="end">{{ t }}</text>
      </g>
    </g>

    <!-- แกน X -->
    <line class="axis-line" [attr.x1]="PL" [attr.x2]="W - PR"
          [attr.y1]="H - PB" [attr.y2]="H - PB" />
    <g *ngFor="let lb of labels; let i = index">
      <text class="axis-text b" [attr.x]="xPos(i)" [attr.y]="H - PB + 26"
            text-anchor="middle">{{ lb }}</text>
    </g>

    <!-- เส้นขอบสีขาวใต้เส้นทุกเส้น วาดไว้ชั้นล่างสุดทั้งหมดก่อน
         เพื่อให้เส้นสีทับกันแล้วยังแยกออกจากกันได้ โดยไม่ไปบังเส้นอื่น -->
    <g class="halos">
      <ng-container *ngFor="let s of series; let si = index">
        <path class="series-halo" *ngIf="!s.dashed"
              [class.is-dim]="isDim(si)"
              [attr.d]="pathFor(s)"
              [style.animation-delay]="si * 180 + 'ms'" />
      </ng-container>
    </g>

    <!-- เส้นข้อมูล -->
    <g class="series" *ngFor="let s of series; let si = index"
       [class.is-dim]="isDim(si)" [class.is-focus]="focusIndex === si">

      <path class="series-path"
            [class.is-dashed]="s.dashed"
            [attr.d]="pathFor(s)"
            [attr.stroke]="colorOf(s, si)"
            [style.animation-delay]="si * 180 + 'ms'" />

      <g *ngFor="let v of s.values; let i = index">
        <circle class="series-dot"
                [attr.cx]="xPos(i)" [attr.cy]="yPos(v)" r="6.5"
                [attr.fill]="'#fff'"
                [attr.stroke]="colorOf(s, si)" stroke-width="3.4"
                [style.animation-delay]="(600 + si * 180 + i * 90) + 'ms'" />
        <text class="axis-text val" *ngIf="showValueFor(si)"
              [attr.x]="xPos(i)" [attr.y]="yPos(v) - 16" text-anchor="middle"
              [attr.fill]="colorOf(s, si)">{{ v | number: valueFormat }}</text>
      </g>
    </g>
  </svg>

  <div class="chart-legend">
    <button type="button" class="legend-item" *ngFor="let s of series; let si = index"
            [class.is-off]="isDim(si)" [class.is-on]="focusIndex === si"
            [attr.aria-pressed]="focusIndex === si"
            (click)="focus(si)">
      <span class="legend-swatch" [style.background]="colorOf(s, si)"></span>{{ s.name }}
    </button>
  </div>

  <p class="chart-hint" *ngIf="series.length > 2">
    แตะชื่อเส้นด้านบนเพื่อดูเฉพาะเส้นนั้นพร้อมตัวเลขกำกับ แตะซ้ำเพื่อกลับไปดูทุกเส้น
  </p>

  <p class="chart-note" *ngIf="note">{{ note }}</p>
</div>
